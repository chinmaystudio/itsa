name: Validate and package static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build & Package Static Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Typecheck Workspace
        run: npm run typecheck

      - name: Prerender Static Site
        run: node scripts/build-static.mjs
        env:
          GITHUB_ACTIONS: "true"

      - name: Upload Static Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: frontend/.output/public
          if-no-files-found: error
